name: CI patched SideStore IPA (login fix 80046)
on:
  push:
    branches: [login-fix-80046]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    env:
      CHANNEL: alpha
      UPSTREAM_CHANNEL: ""
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - run: brew install ldid xcbeautify

      - name: Setup Env
        run: |
          BUILD_NUM="${{ github.run_number }}"
          MARKETING_VERSION=$(python3 scripts/ci/workflow.py get-marketing-version)
          SHORT_COMMIT=$(python3 scripts/ci/workflow.py commit-id)
          NORMALIZED_VERSION=$(python3 scripts/ci/workflow.py compute-normalized "$MARKETING_VERSION" "$BUILD_NUM" "$SHORT_COMMIT")
          python3 scripts/ci/workflow.py set-marketing-version "$NORMALIZED_VERSION"
          echo "MARKETING_VERSION=$NORMALIZED_VERSION" | tee -a "$GITHUB_ENV"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.2"

      - name: Build
        run: |
          python3 scripts/ci/workflow.py build
          mv SideStore.ipa "SideStore-${{ env.MARKETING_VERSION }}.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: SideStore-ipa
          path: SideStore-${{ env.MARKETING_VERSION }}.ipa
